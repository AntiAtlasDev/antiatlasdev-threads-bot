name: Paper.wf Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # كل 6 ساعات
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python paperwf_bot.py
        env:
          PAPERWF_ACCESS_TOKEN: ${{ secrets.PAPERWF_ACCESS_TOKEN }}
          PAPERWF_ALIAS: ${{ secrets.PAPERWF_ALIAS }}
      - name: Commit history
        run: |
          git config user.name "Bot"
          git config user.email "bot@example.com"
          git add paperwf_used_articles.json || true
          git commit -m "Update history" || echo "No changes"
          git push || echo "No changes to push"
