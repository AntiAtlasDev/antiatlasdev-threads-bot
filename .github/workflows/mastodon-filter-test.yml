name: Mastodon Filter Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *' # يعمل كل 3 ساعات

permissions:
  contents: write # ضروري جداً لحفظ السجل في GitHub

jobs:
  filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # ضروري لاستخدام التوكن في الـ push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run filter test
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python mastodon_filter_test.py
