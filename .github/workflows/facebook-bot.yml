name: Facebook Bot
on:
  workflow_dispatch:
  schedule:
  - cron: '0 * * * *' # كل ساعة
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python facebook_bot.py
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      - name: Commit history
        run: |
          git config user.name "Bot"
          git config user.email "bot@example.com"
          git add facebook_used_articles.json || true
          git commit -m "Update Facebook history" || echo "No changes"
          git pull --rebase origin main || echo "Pull failed"
          git push origin main || echo "Push failed"
