name: Telegram Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # كل 30 دقيقة

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # <-- تمت إضافة هذا السطر

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        run: python telegram_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit history
        run: |
          git config user.name "AntiAtlasDev Bot"
          git config user.email "bot@antiatlasdev.com"
          git add telegram_used_articles.json || true
          git commit -m "Update Telegram history" || echo "No changes to commit"
          git pull --rebase origin main || echo "Pull failed, continuing..."
          git push origin main || echo "Push failed, continuing..."
