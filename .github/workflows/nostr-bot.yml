name: Nostr Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *' # يعمل كل 3 ساعات

permissions:
  contents: write # ضروري جداً لحفظ السجل في GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # ضروري لاستخدام التوكن في الـ push

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python nostr_bot.py
        env:
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}

      - name: Commit history
        run: |
          git config user.name "AntiAtlasDev Bot"
          git config user.email "bot@antiatlasdev.com"
          git add nostr_used_articles.json nostr_daily_state.json || true
          git commit -m "Update Nostr history" || echo "No changes to commit"
          git pull --rebase origin main || echo "Pull failed, continuing..."
          git push origin main || echo "Push failed, continuing..."
