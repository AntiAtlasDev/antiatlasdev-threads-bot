name: Threads Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # يعمل كل ساعة

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        run: python bot.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

      - name: Commit history
        run: |
          git config user.name "AntiAtlasDev Bot"
          git config user.email "bot@antiatlasdev.com"
          git add threads_used_articles.json threads_daily_state.json || true
          git commit -m "Update Threads history" || echo "No changes to commit"
          git pull --rebase origin main || echo "Pull failed, continuing..."
          git push origin main || echo "Push failed, continuing..."
